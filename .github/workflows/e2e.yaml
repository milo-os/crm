name: E2E

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Folders under test/e2e to run, space separated (empty runs all)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  TASK_X_REMOTE_TASKFILES: 1
  TASK_ASSUME_YES: 'true'
  TEST_INFRA_CLUSTER_NAME: test-infra

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (startsWith(github.ref, 'refs/heads/') && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.32.13

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.30.0

      - name: Set up the test cluster and deploy CRM
        run: task dev:setup

      - name: Wait for the controller manager
        run: task test-infra:kubectl -- wait --for=condition=Ready pod -l control-plane=crm -n crm-system --timeout=300s

      - name: Run e2e tests
        env:
          TEST_SUITE: ${{ github.event.inputs.test_suite }}
        run: task test:e2e -- $TEST_SUITE

      - name: Collect debug information
        if: failure()
        run: |
          task test-infra:kubectl -- get pods -A || true
          task test-infra:kubectl -- describe pods -n crm-system || true
          task test-infra:kubectl -- logs -n crm-system -l control-plane=crm --tail=200 || true
          task test-infra:kubectl -- get certificates,issuers -n crm-system || true
          kind export logs /tmp/kind-logs --name "$TEST_INFRA_CLUSTER_NAME" || true

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-debug
          path: |
            /tmp/kind-logs/
            chainsaw-report.xml
          if-no-files-found: ignore

      - name: Clean up the test cluster
        if: always()
        run: task test-infra:cluster-down || true
