# SPDX-License-Identifier: AGPL-3.0-only

# ActivityPolicy for the controller-template example Resource
# (example.miloapis.com). It is a reference for writing CRM policies, not part of
# the CRM product. Defines how Resource API operations appear in activity
# timelines.
#
# Audit rules handle the operations captured by the API server audit log.
# eventRules cover what the example controller records on the Resource (see
# api/example/v1alpha1/events.go): the Resource becoming Ready.
#
# Design principles:
# - Action-oriented language ("created example resource ...").
# - Exclude system actors so controller reconciliation does not create noise.
# - Record only successful (2xx), non-dry-run requests; a delete the webhook
#   blocks with deletion protection produces no activity.
# - Say when a person turns deletion protection on or off, rather than
#   "updated". Only patches that set the annotation match, because a full update
#   always carries every annotation and would misreport unrelated edits.
# - Guard every optional field with has(), because a summary that errors sends
#   the record to the dead-letter queue.
# - Event rules read their detail from event.example.miloapis.com/ annotations
#   and guard each one they read.
# - Event-rule links name the kind explicitly: production copies only
#   apiGroup, kind, name, namespace, and uid from an event link, so a link
#   without kind would not resolve to the Resource.
apiVersion: activity.miloapis.com/v1alpha1
kind: ActivityPolicy
metadata:
  name: example.miloapis.com-resource
spec:
  resource:
    apiGroup: example.miloapis.com
    kind: Resource

  auditRules:
    # "alice@example.com created example resource demo"
    - name: create
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create' && has(audit.responseObject) && has(audit.responseObject.metadata) && has(audit.responseObject.metadata.name) && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} created example resource {{ link(audit.responseObject.metadata.name, audit.objectRef) }}"

    - name: create-fallback
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create' && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} created an example resource"

    # "alice@example.com turned on deletion protection for example resource demo"
    - name: deletion-protection
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'patch' && !has(audit.objectRef.subresource) && type(audit.requestObject) == map && has(audit.requestObject.metadata) && type(audit.requestObject.metadata) == map && has(audit.requestObject.metadata.annotations) && type(audit.requestObject.metadata.annotations) == map && 'example.miloapis.com/deletion-protection' in audit.requestObject.metadata.annotations && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} turned {{ audit.requestObject.metadata.annotations['example.miloapis.com/deletion-protection'] == 'true' ? 'on' : 'off' }} deletion protection for example resource {{ link(audit.objectRef.name, audit.objectRef) }}"

    # "alice@example.com updated example resource demo"
    - name: update
      match: "!audit.user.username.startsWith('system:') && audit.verb in ['update', 'patch'] && !has(audit.objectRef.subresource) && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} updated example resource {{ link(audit.objectRef.name, audit.objectRef) }}"

    # The resource is gone, so the summary names it without a link.
    # "alice@example.com deleted example resource demo"
    - name: delete
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'delete' && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} deleted example resource {{ audit.objectRef.name }}"

  eventRules:
    # "Example resource demo is ready: Demo resource."
    - name: ready
      match: "event.reason == 'ResourceReady' && has(event.metadata.annotations) && has(event.regarding.namespace) && 'event.example.miloapis.com/description' in event.metadata.annotations"
      summary: "Example resource {{ link(event.regarding.name, {'apiGroup': 'example.miloapis.com', 'apiVersion': 'v1alpha1', 'kind': 'Resource', 'resource': 'resources', 'namespace': event.regarding.namespace, 'name': event.regarding.name}) }} is ready: {{ event.metadata.annotations['event.example.miloapis.com/description'] }}"

    # "Example resource demo is ready"
    - name: ready-fallback
      match: "event.reason == 'ResourceReady' && has(event.regarding.namespace)"
      summary: "Example resource {{ link(event.regarding.name, {'apiGroup': 'example.miloapis.com', 'apiVersion': 'v1alpha1', 'kind': 'Resource', 'resource': 'resources', 'namespace': event.regarding.namespace, 'name': event.regarding.name}) }} is ready"
