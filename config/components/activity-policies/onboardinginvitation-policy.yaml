# SPDX-License-Identifier: AGPL-3.0-only

# ActivityPolicy for OnboardingInvitation (crm.miloapis.com). CRM creates and
# changes invitations through its send, resend, replace, and cancel actions,
# so most writes come from the CRM service and are excluded. These rules cover
# a person changing an invitation directly, such as a platform operator.
# Sending and redeeming are summarized once the actions exist.
#
# Design principles:
# - Name the invitation, never its recipient email, so emails stay out of the
#   timeline.
# - Exclude system actors so controller and service writes do not create noise.
# - Record only successful (2xx), non-dry-run requests.
# - Guard every optional field with has(), because a summary that errors sends
#   the record to the dead-letter queue.
apiVersion: activity.miloapis.com/v1alpha1
kind: ActivityPolicy
metadata:
  name: crm.miloapis.com-onboardinginvitation
spec:
  resource:
    apiGroup: crm.miloapis.com
    kind: OnboardingInvitation

  auditRules:
    # "alice@example.com created invitation acme-jane"
    - name: create
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create' && has(audit.responseObject) && has(audit.responseObject.metadata) && has(audit.responseObject.metadata.name) && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} created invitation {{ link(audit.responseObject.metadata.name, audit.objectRef) }}"

    - name: create-fallback
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create' && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} created an invitation"

    # "alice@example.com updated invitation acme-jane"
    - name: update
      match: "!audit.user.username.startsWith('system:') && audit.verb in ['update', 'patch'] && !has(audit.objectRef.subresource) && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} updated invitation {{ link(audit.objectRef.name, audit.objectRef) }}"

    # The invitation is gone, so the summary names it without a link.
    # "alice@example.com deleted invitation acme-jane"
    - name: delete
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'delete' && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} deleted invitation {{ audit.objectRef.name }}"
