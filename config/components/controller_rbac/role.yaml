---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crm-manager
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - update
- apiGroups:
  - example.miloapis.com
  resources:
  - resources
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - example.miloapis.com
  resources:
  - resources/finalizers
  verbs:
  - update
- apiGroups:
  - example.miloapis.com
  resources:
  - resources/status
  verbs:
  - get
  - patch
  - update
