---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: crm-webhook
      namespace: system
      path: /mutate-example-miloapis-com-v1alpha1-resource
  failurePolicy: Fail
  name: mresource.kb.io
  rules:
  - apiGroups:
    - example.miloapis.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - resources
  sideEffects: None
