---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: onboardinginvitations.crm.miloapis.com
spec:
  group: crm.miloapis.com
  names:
    kind: OnboardingInvitation
    listKind: OnboardingInvitationList
    plural: onboardinginvitations
    singular: onboardinginvitation
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.onboardingRef.name
      name: Onboarding
      type: string
    - jsonPath: .spec.personRef.name
      name: Person
      type: string
    - jsonPath: .spec.recipientEmail
      name: Recipient
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.expiresAt
      name: Expires
      type: date
    - jsonPath: .status.redeemedUserRef.name
      name: Redeemed By
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OnboardingInvitation is one recipient's invitation to complete an
          OrganizationOnboarding. CRM creates it when staff send the onboarding; staff
          can view invitations but not create or change them. It is cluster-scoped and
          visible only to Milo staff.

          An onboarding can have many invitations over time, one per send or
          replacement, but only its status.currentInvitationRef can be used. List an
          onboarding's or a Person's invitations with a field selector on
          spec.onboardingRef.name or spec.personRef.name.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              OnboardingInvitationSpec is who the invitation is for, captured when it was
              sent. CRM's send action fills it in when it creates the invitation; no
              client sets it, and none of it can change afterwards. Everything CRM does
              with the invitation is in status.

              whose Company isn't the onboarding's Company.
            properties:
              onboardingRef:
                description: |-
                  OnboardingRef is the onboarding the invitation is for. It can't be
                  changed. Resending or replacing an invitation continues the same
                  onboarding.
                properties:
                  name:
                    description: Name is the OrganizationOnboarding's name.
                    maxLength: 253
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: 'must be a valid OrganizationOnboarding name: lowercase
                        letters, digits, ''-'', and ''.'', starting and ending with
                        a letter or digit'
                      rule: self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$')
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: onboardingRef can't be changed
                  rule: self == oldSelf
              personRef:
                description: |-
                  PersonRef is the Person invited. It can't be changed; to invite someone
                  else, the onboarding's invitation is replaced.
                properties:
                  name:
                    description: Name is the Person's name.
                    maxLength: 253
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: 'must be a valid Person name: lowercase letters, digits,
                        ''-'', and ''.'', starting and ending with a letter or digit'
                      rule: self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$')
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: personRef can't be changed
                  rule: self == oldSelf
              recipientEmail:
                description: |-
                  RecipientEmail is the Person's email when the invitation was sent. CRM
                  copies it from the Person as it creates the invitation. It can't be
                  changed, so changing the Person later never redirects an invitation
                  already sent. Only a User whose verified email matches it can redeem
                  the invitation.
                maxLength: 254
                type: string
                x-kubernetes-validations:
                - message: must be an email address, such as jane@example.com
                  rule: self.matches('^[^@[:space:]]+@[^@[:space:]]+[.][^@[:space:]]+$')
                - message: recipientEmail can't be changed
                  rule: self == oldSelf
            required:
            - onboardingRef
            - personRef
            - recipientEmail
            type: object
          status:
            description: |-
              OnboardingInvitationStatus is what CRM has recorded about the invitation.
              Only CRM writes it; staff roles can read it but not change it, so clients
              can't set the inviter or claim a redemption.

              The invitation holds no link, credential, or anything else that grants
              access to the onboarding. Access comes from IAM, which CRM grants to the
              recipient.

              agreement version, the redeeming User, and when. It belongs to this
              recipient, so a replacement starts without it.
            properties:
              conditions:
                description: |
                  Conditions report delivery, redemption, expiration, and revocation, for
                  example when the invitation is replaced or the onboarding is cancelled.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              expiresAt:
                description: |-
                  ExpiresAt is when the invitation stops working if it hasn't been
                  redeemed, seven days after it was sent. A redeemed invitation doesn't
                  expire, and an expired one doesn't erase the onboarding's progress.

                  new invitation is decided with the action API (#12).
                format: date-time
                type: string
              inviterRef:
                description: |
                  InviterRef is the staff User who sent the invitation, taken from the
                  authenticated request, never from the request body.
                properties:
                  name:
                    description: Name is the User's name.
                    maxLength: 253
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: 'must be a valid User name: lowercase letters, digits,
                        ''-'', and ''.'', starting and ending with a letter or digit'
                      rule: self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$')
                required:
                - name
                type: object
              observedGeneration:
                description: ObservedGeneration is the spec generation the status
                  reflects.
                format: int64
                type: integer
              phase:
                description: |-
                  Phase is where the invitation is in its lifecycle. The conditions give
                  the details, such as why it was revoked.

                  redeemed, expired, or revoked. Whether actions or the invitation
                  controller write each phase is decided with the action API (#12).
                enum:
                - Pending
                - Sent
                - Redeemed
                - Expired
                - Revoked
                type: string
              redeemedTime:
                description: |
                  RedeemedTime is when the invitation was redeemed.
                format: date-time
                type: string
              redeemedUserRef:
                description: |
                  RedeemedUserRef is the Milo User who redeemed the invitation: the
                  signed-in User whose verified email matched recipientEmail. While this
                  is the onboarding's current invitation, only this User can work on the
                  onboarding, and on completion this User becomes the organization's
                  first administrator.
                properties:
                  name:
                    description: Name is the User's name.
                    maxLength: 253
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: 'must be a valid User name: lowercase letters, digits,
                        ''-'', and ''.'', starting and ending with a letter or digit'
                      rule: self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$')
                required:
                - name
                type: object
              sentTime:
                description: |
                  SentTime is when the invitation was sent.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    selectableFields:
    - jsonPath: .spec.onboardingRef.name
    - jsonPath: .spec.personRef.name
    served: true
    storage: true
    subresources:
      status: {}
