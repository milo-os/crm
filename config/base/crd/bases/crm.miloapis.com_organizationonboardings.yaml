---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: organizationonboardings.crm.miloapis.com
spec:
  group: crm.miloapis.com
  names:
    kind: OrganizationOnboarding
    listKind: OrganizationOnboardingList
    plural: organizationonboardings
    singular: organizationonboarding
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.companyRef.name
      name: Company
      type: string
    - jsonPath: .spec.opportunityRef.name
      name: Opportunity
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.billing.currency
      name: Currency
      type: string
    - jsonPath: .spec.billing.paymentArrangement
      name: Payment
      type: string
    - jsonPath: .status.organizationRef.name
      name: Organization
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OrganizationOnboarding is the setup journey for one customer organization:
          the details sales prepares, the billing choices, and the progress toward
          completion. Resends and replacements of its invitation continue the same
          onboarding; only a new onboarding creates another organization. It is
          cluster-scoped and managed only by Milo staff.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              OrganizationOnboardingSpec is what staff prepare, and the customer later
              completes, to set up one organization.

              IAM decides who can change it: staff, and once invited, the customer. The
              Company and Opportunity never change; once the onboarding is sent, the
              currency and payment arrangement can't change either; and once it is
              submitted or cancelled, nothing in the spec can, so CRM sets up exactly
              what was submitted.
            properties:
              billing:
                description: Billing is how the organization will be billed.
                properties:
                  contactInfo:
                    description: |-
                      ContactInfo is the billing contact and the address invoices are issued
                      to. It follows the BillingAccount's contactInfo
                      (billing.miloapis.com). CRM never stores payment credentials.
                    properties:
                      address:
                        description: Address is the postal address invoices are issued
                          to.
                        properties:
                          city:
                            description: City is the locality.
                            maxLength: 128
                            type: string
                          country:
                            description: |
                              Country is the ISO 3166-1 alpha-2 country code, such as US or GB. It
                              is optional so a partly entered address can be saved, but the
                              Organization and the BillingAccount require it.
                            type: string
                            x-kubernetes-validations:
                            - message: must be a two-letter country code, such as
                                US or GB
                              rule: self.matches('^[A-Z]{2}$')
                          line1:
                            description: Line1 is the first line of the street address.
                            maxLength: 256
                            type: string
                          line2:
                            description: Line2 is the second line of the street address.
                            maxLength: 256
                            type: string
                          postalCode:
                            description: PostalCode is the postal or zip code.
                            maxLength: 32
                            type: string
                          region:
                            description: Region is the state, province, or county.
                            maxLength: 128
                            type: string
                        type: object
                      businessName:
                        description: BusinessName is the legal entity that pays, printed
                          on invoices.
                        maxLength: 256
                        type: string
                      email:
                        description: |-
                          Email is the billing contact's email. It receives billing
                          notifications, and invoices when invoiceEmails is empty.
                        maxLength: 254
                        type: string
                        x-kubernetes-validations:
                        - message: must be an email address, such as jane@example.com
                          rule: self.matches('^[^@[:space:]]+@[^@[:space:]]+[.][^@[:space:]]+$')
                      invoiceEmails:
                        description: |-
                          InvoiceEmails is where invoices are emailed. It allows one entry:
                          BillingAccount accepts up to 10, but Billing only ever sends to the
                          first, so a second would be silently ignored.
                        items:
                          maxLength: 254
                          type: string
                          x-kubernetes-validations:
                          - message: must be an email address, such as jane@example.com
                            rule: self.matches('^[^@[:space:]]+@[^@[:space:]]+[.][^@[:space:]]+$')
                        maxItems: 1
                        type: array
                        x-kubernetes-list-type: set
                      name:
                        description: Name is the individual billing contact.
                        maxLength: 256
                        type: string
                    type: object
                  currency:
                    description: |-
                      Currency is the billing account's currency. Staff choose it, and it
                      can't be changed once the onboarding is sent. Billing only bills in USD
                      today; more currencies are added here when Billing supports them.
                    enum:
                    - USD
                    type: string
                  invoice:
                    description: |-
                      Invoice holds details for invoices when paymentArrangement is Invoice.
                      CRM sets them on the Invoice BillingArrangement it creates. Billing's
                      standard terms always apply; custom terms are out of scope.

                      details, or only staff before sending.
                    properties:
                      accountsPayableEmail:
                        description: |-
                          AccountsPayableEmail receives invoices in addition to the billing
                          contact.
                        maxLength: 254
                        type: string
                        x-kubernetes-validations:
                        - message: must be an email address, such as jane@example.com
                          rule: self.matches('^[^@[:space:]]+@[^@[:space:]]+[.][^@[:space:]]+$')
                      agreementReference:
                        description: |-
                          AgreementReference identifies a signed MSA or order form. Without one,
                          the standard terms of service apply.
                        maxLength: 128
                        type: string
                      purchaseOrderNumber:
                        description: |-
                          PurchaseOrderNumber is the customer's purchase order number, printed
                          on invoices.
                        maxLength: 64
                        type: string
                    type: object
                  paymentArrangement:
                    default: Card
                    description: |-
                      PaymentArrangement is how the customer will pay: Card or Invoice. Staff
                      choose it, and it can't be changed once the onboarding is sent.
                      Defaults to Card.
                    enum:
                    - Card
                    - Invoice
                    type: string
                  taxIds:
                    description: |-
                      TaxIDs are the organization's tax registrations, such as a VAT number,
                      printed on invoices. They follow the BillingAccount's taxIds: one
                      entry per type.
                    items:
                      description: TaxID is a tax registration. It follows the BillingAccount's
                        taxIds.
                      properties:
                        type:
                          description: |-
                            Type is the tax registration scheme, written as
                            <jurisdiction>_<scheme>, such as gb_vat, eu_vat, or us_ein.
                          maxLength: 32
                          type: string
                          x-kubernetes-validations:
                          - message: must be <jurisdiction>_<scheme>, such as gb_vat,
                              eu_vat, or us_ein
                            rule: self.matches('^[a-z]{2}_[a-z][a-z_]*$')
                        value:
                          description: Value is the registration number, such as GB123456789.
                          maxLength: 64
                          minLength: 1
                          type: string
                          x-kubernetes-validations:
                          - message: must not be blank
                            rule: '!self.matches(''^[[:space:]]*$'')'
                      required:
                      - type
                      - value
                      type: object
                    maxItems: 10
                    type: array
                    x-kubernetes-list-map-keys:
                    - type
                    x-kubernetes-list-type: map
                required:
                - currency
                type: object
                x-kubernetes-validations:
                - message: invoice details can only be set when paymentArrangement
                    is Invoice
                  rule: '!has(self.invoice) || self.paymentArrangement == ''Invoice'''
              companyRef:
                description: |-
                  CompanyRef is the Company the organization is for. It can't be changed.
                  The Company must exist. The Company owns the onboarding: deleting the
                  Company deletes the onboarding, but never the organization it created.
                properties:
                  name:
                    description: Name is the Company's name.
                    maxLength: 253
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: 'must be a valid Company name: lowercase letters, digits,
                        ''-'', and ''.'', starting and ending with a letter or digit'
                      rule: self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$')
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: companyRef can't be changed
                  rule: self == oldSelf
              opportunityRef:
                description: |-
                  OpportunityRef is the Opportunity the onboarding started from. It can't
                  be changed. An Opportunity can have more than one onboarding, each
                  setting up its own organization.
                  The Opportunity must exist and be with this onboarding's Company.
                properties:
                  name:
                    description: Name is the Opportunity's name.
                    maxLength: 253
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: 'must be a valid Opportunity name: lowercase letters,
                        digits, ''-'', and ''.'', starting and ending with a letter
                        or digit'
                      rule: self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$')
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: opportunityRef can't be changed
                  rule: self == oldSelf
              organizationDetails:
                description: |-
                  OrganizationDetails are the details of the organization to create.
                  Staff fill in what they know; the customer completes the rest.
                properties:
                  contactInfo:
                    description: ContactInfo is who the organization is and how to
                      reach them.
                    properties:
                      address:
                        description: Address is the organization's postal address.
                        properties:
                          city:
                            description: City is the locality.
                            maxLength: 128
                            type: string
                          country:
                            description: |
                              Country is the ISO 3166-1 alpha-2 country code, such as US or GB. It
                              is optional so a partly entered address can be saved, but the
                              Organization and the BillingAccount require it.
                            type: string
                            x-kubernetes-validations:
                            - message: must be a two-letter country code, such as
                                US or GB
                              rule: self.matches('^[A-Z]{2}$')
                          line1:
                            description: Line1 is the first line of the street address.
                            maxLength: 256
                            type: string
                          line2:
                            description: Line2 is the second line of the street address.
                            maxLength: 256
                            type: string
                          postalCode:
                            description: PostalCode is the postal or zip code.
                            maxLength: 32
                            type: string
                          region:
                            description: Region is the state, province, or county.
                            maxLength: 128
                            type: string
                        type: object
                      businessName:
                        description: BusinessName is the legal entity or company name.
                        maxLength: 256
                        type: string
                      email:
                        description: Email is the primary contact email.
                        maxLength: 254
                        type: string
                        x-kubernetes-validations:
                        - message: must be an email address, such as jane@example.com
                          rule: self.matches('^[^@[:space:]]+@[^@[:space:]]+[.][^@[:space:]]+$')
                      name:
                        description: Name is the display name of the primary contact.
                        maxLength: 256
                        type: string
                    type: object
                  displayName:
                    description: |-
                      DisplayName is the organization's human-readable name.

                      business name, then their name, as the cloud portal does.
                    maxLength: 256
                    type: string
                    x-kubernetes-validations:
                    - message: must not be blank
                      rule: '!self.matches(''^[[:space:]]*$'')'
                type: object
            required:
            - billing
            - companyRef
            - opportunityRef
            type: object
          status:
            description: |-
              OrganizationOnboardingStatus is the onboarding's progress, written only by
              CRM. Staff roles can read it but not change it, so clients can't set
              completion state. Fields may change once the action API is built.

              authenticated User, and when. It belongs to the recipient, not to the
              reusable organization details, so a replacement recipient starts without
              it; it likely lives on the OnboardingInvitation (#10). The agreements and
              their versions are identified in #14.

              The links to what the onboarding created can't be changed or removed once
              set; currentInvitationRef can, since a resend or replacement moves it.
            properties:
              billingAccountRef:
                description: |
                  BillingAccountRef is the BillingAccount this onboarding created, in the
                  organization's namespace. Deleting the onboarding never deletes it. It
                  must exist in the namespace of organizationRef, which must be set.
                  Once set, it can't be changed or removed.
                properties:
                  name:
                    description: Name is the BillingAccount's name.
                    maxLength: 253
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: 'must be a valid BillingAccount name: lowercase letters,
                        digits, ''-'', and ''.'', starting and ending with a letter
                        or digit'
                      rule: self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$')
                required:
                - name
                type: object
              completionTime:
                description: |
                  CompletionTime is when the onboarding completed. It is kept as a
                  historical record even if the organization or billing changes later.
                format: date-time
                type: string
              conditions:
                description: |-
                  Conditions report progress and anything blocking it, such as billing
                  or organization readiness.

                  built.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentInvitationRef:
                description: |
                  CurrentInvitationRef is the onboarding's one current invitation. Only
                  this invitation can be redeemed or used; a resend or replacement moves
                  it, so older links stop working. The invitation must exist and be for
                  this onboarding.
                properties:
                  name:
                    description: Name is the OnboardingInvitation's name.
                    maxLength: 253
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: 'must be a valid OnboardingInvitation name: lowercase
                        letters, digits, ''-'', and ''.'', starting and ending with
                        a letter or digit'
                      rule: self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$')
                required:
                - name
                type: object
              invoiceAuthorization:
                description: |-
                  InvoiceAuthorization records the staff User who chose Invoice billing
                  and when. It is the evidence that invoicing was authorized; a
                  customer can't grant it.

                  User when the payment arrangement is Invoice.
                properties:
                  time:
                    description: Time is when invoicing was authorized.
                    format: date-time
                    type: string
                  userRef:
                    description: UserRef is the staff User who authorized invoicing.
                      The User must exist.
                    properties:
                      name:
                        description: Name is the User's name.
                        maxLength: 253
                        minLength: 1
                        type: string
                        x-kubernetes-validations:
                        - message: 'must be a valid User name: lowercase letters,
                            digits, ''-'', and ''.'', starting and ending with a letter
                            or digit'
                          rule: self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$')
                    required:
                    - name
                    type: object
                required:
                - time
                - userRef
                type: object
              observedGeneration:
                description: ObservedGeneration is the spec generation the status
                  reflects.
                format: int64
                type: integer
              organizationRef:
                description: |
                  OrganizationRef is the organization this onboarding created. It stays
                  linked after completion; deleting the onboarding never deletes it. The
                  organization must exist and be one the onboarding's Company links in
                  spec.organizationRefs, so CRM links it there first. Once set, it can't
                  be changed or removed.
                properties:
                  name:
                    description: Name is the organization's name.
                    maxLength: 63
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: 'must be a valid organization name: lowercase letters,
                        digits, and ''-'', starting and ending with a letter or digit'
                      rule: self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
                required:
                - name
                type: object
              phase:
                description: |-
                  Phase is where the onboarding is in its lifecycle. An onboarding with
                  no phase yet is a draft.

                  actions, and by completion.
                enum:
                - Draft
                - Invited
                - InProgress
                - Completing
                - Complete
                - Cancelled
                type: string
            type: object
            x-kubernetes-validations:
            - message: organizationRef can't be changed or removed once set
              rule: '!has(oldSelf.organizationRef) || (has(self.organizationRef) &&
                self.organizationRef == oldSelf.organizationRef)'
            - message: billingAccountRef can't be changed or removed once set
              rule: '!has(oldSelf.billingAccountRef) || (has(self.billingAccountRef)
                && self.billingAccountRef == oldSelf.billingAccountRef)'
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - fieldPath: .spec.billing.currency
          message: currency can't be changed once the onboarding is sent; start a
            new onboarding
          rule: '!has(oldSelf.status) || !has(oldSelf.status.phase) || oldSelf.status.phase
            == ''Draft'' || self.spec.billing.currency == oldSelf.spec.billing.currency'
        - fieldPath: .spec.billing.paymentArrangement
          message: paymentArrangement can't be changed once the onboarding is sent;
            start a new onboarding
          rule: '!has(oldSelf.status) || !has(oldSelf.status.phase) || oldSelf.status.phase
            == ''Draft'' || self.spec.billing.paymentArrangement == oldSelf.spec.billing.paymentArrangement'
        - fieldPath: .spec
          message: the onboarding was submitted or cancelled; its details can't be
            changed
          rule: '!has(oldSelf.status) || !has(oldSelf.status.phase) || !(oldSelf.status.phase
            in [''Completing'', ''Complete'', ''Cancelled'']) || self.spec == oldSelf.spec'
    served: true
    storage: true
    subresources:
      status: {}
